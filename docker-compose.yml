version: "3.8"

services:
  # ========== 基础设施：Nacos 注册中心 ==========
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== 业务服务 ==========

  task-scheduler:
    build:
      context: .
      dockerfile: task-scheduler/Dockerfile
    container_name: task-scheduler
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=task-scheduler
      - SERVICE_HOST=task-scheduler
      - SERVICE_PORT=8080
      - NACOS_SERVER=nacos:8848
      - NACOS_NAMESPACE=
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./data/scheduler:/app/data

  api-scanner:
    build:
      context: .
      dockerfile: api-scanner/Dockerfile
    container_name: api-scanner
    ports:
      - "8081:8081"
    environment:
      - SERVICE_NAME=api-scanner
      - SERVICE_HOST=api-scanner
      - SERVICE_PORT=8081
      - NACOS_SERVER=nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./data/scanner:/app/data

  ai-planner:
    build:
      context: .
      dockerfile: ai-planner/Dockerfile
    container_name: ai-planner
    ports:
      - "8082:8082"
    environment:
      - SERVICE_NAME=ai-planner
      - SERVICE_HOST=ai-planner
      - SERVICE_PORT=8082
      - NACOS_SERVER=nacos:8848
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
      - AI_BASE_URL=${AI_BASE_URL:-}
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./data/planner:/app/data

  test-executor:
    build:
      context: .
      dockerfile: test-executor/Dockerfile
    container_name: test-executor
    ports:
      - "8083:8083"
    environment:
      - SERVICE_NAME=test-executor
      - SERVICE_HOST=test-executor
      - SERVICE_PORT=8083
      - NACOS_SERVER=nacos:8848
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - REQUEST_TIMEOUT=30
    depends_on:
      nacos:
        condition: service_healthy
    volumes:
      - ./data/executor:/app/data
      - ./reports:/app/reports
